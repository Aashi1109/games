name: Verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          lfs: true
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - run: pnpm audit --prod
      - run: pnpm run build
      - run: pnpm run test:launch
      - run: pnpm run test:lifecycle
      - run: pnpm exec playwright install --with-deps chromium
      - name: Browser smoke tests
        run: |
          mkdir -p tmp
          pnpm start > tmp/questline-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4180/health; then break; fi
            sleep 1
          done
          pnpm run test:e2e
      - uses: actions/upload-artifact@v7.0.2
        if: failure()
        with:
          name: browser-results
          path: tmp/test-results/
