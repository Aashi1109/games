name: questline

services:
  questline:
    image: ghcr.io/aashi1109/questline:latest
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: '8080'
      TRUST_PROXY: 'true'
    networks:
      - web

networks:
  web:
    external: true
